<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Mario - Tìm Hiểu Áo Dài</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #0f0f14;
    font-family: 'Press Start 2P', monospace;
  }

  #game-container {
    width: 900px;
    height: 520px;
    position: relative;
    overflow: hidden;
    border: 6px solid #fff;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
    transition: background 0.5s ease;
  }

  /* 4 màu nền tượng trưng cho 4 màn chơi */
  .world-1 { background: linear-gradient(#5c94fc 72%, #00a800 72%, #00a800 76%, #d85000 76%); }
  .world-2 { background: linear-gradient(#000088 72%, #008888 72%, #008888 76%, #004444 76%); }
  .world-3 { background: linear-gradient(#f89040 72%, #fc9838 72%, #fc9838 76%, #803000 76%); }
  .world-4 { background: linear-gradient(#202020 72%, #888888 72%, #888888 76%, #444444 76%); }

  #hud {
    position: absolute;
    top: 16px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    color: #fff;
    font-size: 14px;
    text-shadow: 2px 2px #000;
    z-index: 10;
  }

  /* Khối gạch hỏi chấm */
  #question-box {
    width: 60px;
    height: 60px;
    position: absolute;
    top: 170px;
    left: 550px;
    background: #fc9838;
    border: 4px solid #000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    color: #fff;
    text-shadow: 2px 2px #a84000;
    box-shadow: inset -4px -4px 0 #a84000, inset 4px 4px 0 #ffe088;
    z-index: 5;
    transition: top 0.15s ease;
  }

  /* Nhân vật Mario dựng bằng pixel CSS */
  #mario {
    width: 48px;
    height: 68px;
    position: absolute;
    bottom: 125px;
    left: 60px;
    z-index: 6;
  }
  .mario-cap { width: 38px; height: 16px; background: #e52521; position: absolute; top: 0; left: 8px; border-radius: 3px; }
  .mario-face { width: 32px; height: 26px; background: #fccc96; position: absolute; top: 12px; left: 10px; }
  .mario-eye { width: 6px; height: 8px; background: #000; position: absolute; top: 18px; right: 8px; }
  .mario-mustache { width: 18px; height: 8px; background: #4b2505; position: absolute; top: 26px; right: 6px; }
  .mario-shirt { width: 34px; height: 25px; background: #0026e6; position: absolute; top: 34px; left: 7px; }
  .mario-overalls { width: 16px; height: 25px; background: #e52521; position: absolute; top: 34px; left: 16px; }
  .mario-shoe { width: 42px; height: 12px; background: #4b2505; position: absolute; bottom: 0; left: 3px; border-radius: 4px; }

  /* Bảng câu hỏi trắc nghiệm */
  #quiz-modal {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 720px;
    background: #000;
    border: 5px solid #fff;
    padding: 22px;
    color: #fff;
    z-index: 20;
    box-shadow: 0 0 30px #000;
  }

  #question-text {
    font-size: 13px;
    line-height: 1.8;
    margin-bottom: 20px;
    color: #ffeb3b;
  }

  .answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .ans-btn {
    font-family: inherit;
    font-size: 10.5px;
    padding: 12px 10px;
    background: #1a1a1a;
    color: #fff;
    border: 3px solid #e45c10;
    cursor: pointer;
    line-height: 1.5;
    text-align: left;
  }
  .ans-btn:hover {
    background: #e45c10;
    color: #000;
  }

  /* Màn hình thông báo */
  .overlay-screen {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    z-index: 30;
    text-align: center;
  }

  .btn-action {
    font-family: inherit;
    margin-top: 25px;
    padding: 16px 28px;
    font-size: 14px;
    background: #e52521;
    color: #fff;
    border: 4px solid #fff;
    cursor: pointer;
    box-shadow: 0 6px 0 #800;
  }
  .btn-action:active {
    transform: translateY(4px);
    box-shadow: none;
  }
</style>
</head>
<body>

<div id="game-container" class="world-1">
  <div id="hud">
    <div>MARIO<br><span id="score">000000</span></div>
    <div>COINS<br>x<span id="coins">00</span></div>
    <div>WORLD<br><span id="world-tag">1-1</span></div>
  </div>

  <div id="question-box">?</div>

  <div id="mario">
    <div class="mario-cap"></div>
    <div class="mario-face"></div>
    <div class="mario-eye"></div>
    <div class="mario-mustache"></div>
    <div class="mario-shirt"></div>
    <div class="mario-overalls"></div>
    <div class="mario-shoe"></div>
  </div>

  <!-- Bảng trắc nghiệm -->
  <div id="quiz-modal">
    <div id="question-text">Câu hỏi...</div>
    <div class="answers-grid" id="answers-container"></div>
  </div>

  <!-- Màn hình Bắt đầu -->
  <div id="start-screen" class="overlay-screen">
    <h1 style="color: #ffeb3b; font-size: 26px; line-height: 1.6;">SUPER MARIO<br>ÁO DÀI VIỆT NAM</h1>
    <button class="btn-action" style="background:#00a800;" onclick="startGame()">BẮT ĐẦU CHƠI</button>
  </div>

  <!-- Màn hình Thua (Game Over) -->
  <div id="gameover-screen" class="overlay-screen" style="display: none;">
    <h1 style="color: #e52521; font-size: 32px;">GAME OVER</h1>
    <p style="font-size: 12px; line-height: 2; color: #ff9999;">Bạn đã chọn sai đáp án!</p>
    <button class="btn-action" onclick="restartCurrentLevel()">CHƠI LẠI MÀN NÀY</button>
  </div>

  <!-- Màn hình Chiến Thắng -->
  <div id="victory-screen" class="overlay-screen" style="display: none;">
    <h1 style="color: #ffeb3b; font-size: 30px;">CHIẾN THẮNG!</h1>
    <p style="font-size: 12px; line-height: 2; max-width: 650px;">
      BẠN ĐÃ CÙNG MARIO HOÀN THÀNH XUẤT SẮC HÀNH TRÌNH BẢO VỆ VÀ LAN TỎA GIÁ TRỊ ÁO DÀI TRUYỀN THỐNG!
    </p>
    <button class="btn-action" style="background:#00a800;" onclick="restartWholeGame()">CHƠI LẠI TỪ ĐẦU</button>
  </div>
</div>

<script>
  const questions = [
    {
      world: "1-1",
      worldClass: "world-1",
      q: "Câu 1: Áo dài Việt Nam đã trải qua những giai đoạn phát triển nào? Hai kiểu áo dài nổi tiếng trong lịch sử là gì?",
      options: [
        "A. Áo dài hiện đại và áo bà ba.",
        "B. Áo ngũ thân và áo dài Lemur.",
        "C. Áo tứ thân và áo bà ba.",
        "D. Áo dài cách tân và áo Nhật Bình."
      ],
      correct: 1
    },
    {
      world: "1-2",
      worldClass: "world-2",
      q: "Câu 2: Năm chiếc cúc trên áo ngũ thân truyền thống tượng trưng cho năm đức tính nào của con người?",
      options: [
        "A. Trung, Hiếu, Lễ, Nghĩa, Dũng.",
        "B. Cần, Kiệm, Liêm, Chính, Chí công vô tư.",
        "C. Nhân, Lễ, Nghĩa, Trí, Tín.",
        "D. Nhân, Ái, Hòa, Bình, Tín."
      ],
      correct: 2
    },
    {
      world: "1-3",
      worldClass: "world-3",
      q: "Câu 3: Việc cách tân áo dài quá đà có thể gây ra ảnh hưởng gì đến giá trị văn hóa truyền thống?",
      options: [
        "A. Làm tăng giá trị lịch sử của áo dài.",
        "B. Giúp áo dài giữ nguyên bản sắc dân tộc.",
        "C. Làm cho áo dài trở nên trang trọng hơn trong mọi hoàn cảnh.",
        "D. Làm mất đi vẻ đẹp truyền thống, phai mờ bản sắc văn hóa dân tộc."
      ],
      correct: 3
    },
    {
      world: "1-4",
      worldClass: "world-4",
      q: "Câu 4: Học sinh cần làm gì để góp phần giữ gìn và lan tỏa vẻ đẹp của áo dài Việt Nam?",
      options: [
        "A. Tìm hiểu lịch sử áo dài, mặc áo dài phù hợp trong các dịp lễ và chia sẻ hình ảnh đẹp để quảng bá văn hóa dân tộc.",
        "B. Chỉ mặc áo dài khi được nhà trường yêu cầu.",
        "C. Thay đổi hoàn toàn kiểu dáng áo dài truyền thống theo sở thích.",
        "D. Không cần tìm hiểu về lịch sử và ý nghĩa của áo dài."
      ],
      correct: 0
    }
  ];

  let currentLevel = 0;
  let score = 0;
  let coins = 0;

  const mario = document.getElementById("mario");
  const qBox = document.getElementById("question-box");
  const modal = document.getElementById("quiz-modal");
  const qText = document.getElementById("question-text");
  const answersBox = document.getElementById("answers-container");
  const gameContainer = document.getElementById("game-container");
  const worldTag = document.getElementById("world-tag");
  const scoreDisplay = document.getElementById("score");
  const coinsDisplay = document.getElementById("coins");

  function startGame() {
    document.getElementById("start-screen").style.display = "none";
    runLevel();
  }

  function runLevel() {
    const data = questions[currentLevel];
    gameContainer.className = data.worldClass;
    worldTag.innerText = data.world;

    modal.style.display = "none";
    document.getElementById("gameover-screen").style.display = "none";
    document.getElementById("victory-screen").style.display = "none";

    // Đặt vị trí ban đầu cho Mario và khối gạch
    let marioX = 60;
    let marioY = 125;
    mario.style.left = marioX + "px";
    mario.style.bottom = marioY + "px";
    qBox.style.top = "170px";
    qBox.innerText = "?";
    qBox.style.background = "#fc9838";

    // 1. Mario chạy về phía khối gạch
    const runTimer = setInterval(() => {
      marioX += 5;
      mario.style.left = marioX + "px";

      if (marioX >= 555) {
        clearInterval(runTimer);
        // 2. Mario nhảy lên húc gạch
        jumpAndHit(marioX, marioY, data);
      }
    }, 16);
  }

  function jumpAndHit(x, y, data) {
    let vy = 12;
    let currentY = y;

    const jumpTimer = setInterval(() => {
      currentY += vy;
      vy -= 0.6; // Trọng lực
      mario.style.bottom = currentY + "px";

      // Khi chạm đỉnh và va vào khối gạch
      if (currentY >= 235 && qBox.innerText === "?") {
        qBox.style.top = "140px"; // Hộp gạch nảy lên
        setTimeout(() => {
          qBox.style.top = "170px";
          qBox.innerText = "★";
          qBox.style.background = "#8d8d8d";
        }, 120);

        coins++;
        coinsDisplay.innerText = coins < 10 ? "0" + coins : coins;
      }

      // Khi rơi lại xuống đất
      if (currentY <= 125) {
        clearInterval(jumpTimer);
        mario.style.bottom = "125px";

        // Mở bảng câu hỏi
        setTimeout(() => {
          showQuiz(data);
        }, 300);
      }
    }, 16);
  }

  function showQuiz(data) {
    qText.innerText = data.q;
    answersBox.innerHTML = "";
    data.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "ans-btn";
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(idx, data.correct);
      answersBox.appendChild(btn);
    });
    modal.style.display = "block";
  }

  function checkAnswer(selected, correct) {
    modal.style.display = "none";
    if (selected === correct) {
      score += 1000;
      scoreDisplay.innerText = score.toString().padStart(6, "0");

      // Trả lời đúng: Mario chạy qua bên phải màn hình
      let x = 555;
      const walkOutTimer = setInterval(() => {
        x += 6;
        mario.style.left = x + "px";
        if (x > 920) {
          clearInterval(walkOutTimer);
          currentLevel++;
          if (currentLevel < questions.length) {
            runLevel(); // Sang màn mới với màu nền mới
          } else {
            document.getElementById("victory-screen").style.display = "flex";
          }
        }
      }, 16);
    } else {
      // Trả lời sai: Báo thua
      document.getElementById("gameover-screen").style.display = "flex";
    }
  }

  function restartCurrentLevel() {
    runLevel();
  }

  function restartWholeGame() {
    currentLevel = 0;
    score = 0;
    coins = 0;
    scoreDisplay.innerText = "000000";
    coinsDisplay.innerText = "00";
    runLevel();
  }
</script>
</body>
</html>
